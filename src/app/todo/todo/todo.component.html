<div class="row">
  <div class="col">
    <ol class="list-group">
      @for (todo of todos(); track todo.id) {
        <li class="list-group-item">
          {{todo.name}} : {{todo.content}} ({{todo.status}})
          <i (click)="deleteTodo(todo.id)" class="fa fa-trash" aria-hidden="true"></i>
        </li>
      }
    </ol>
  </div>
  <div class="col">
    name: <input [(ngModel)]="name" type="text" class="form-control">
    content: <input [(ngModel)]="content" type="text" class="form-control">
    <button (click)="addTodo()" [disabled]="!canAdd()"
    class="btn btn-primary m-2">add</button>
  </div>
</div>

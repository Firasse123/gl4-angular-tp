<div class="bg-info-subtle p-2">
  <div class="d-flex gap-2 mb-2">
    <input [(ngModel)]="name" type="text" class="form-control form-control-sm" placeholder="name">
    <input [(ngModel)]="content" type="text" class="form-control form-control-sm" placeholder="content">
    <button (click)="addTodo()" [disabled]="!canAdd()" class="btn btn-danger btn-sm">add</button>
  </div>

  <div class="row g-0">
    @for (column of columns; track column.title) {
      <div class="col border p-2" [class]="column.color">
        <div class="mb-2">{{column.title}}</div>
        @for (todo of column.todos(); track todo.id) {
          <div class="card mb-2">
            <div class="card-body p-2">
              <div class="d-flex justify-content-between">
                <strong>{{todo.name}}</strong>
                <i (click)="deleteTodo(todo.id)" class="fa fa-trash text-danger" aria-hidden="true"></i>
              </div>
              <p class="small mb-1">{{todo.content}}</p>
              <select class="form-select form-select-sm"
                [ngModel]="todo.status" (ngModelChange)="changeStatus(todo.id, $event)">
                @for (status of statuses; track status) {
                  <option [value]="status">{{status}}</option>
                }
              </select>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>

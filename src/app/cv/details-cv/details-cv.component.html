@if (cv(); as displayedCv) {
  <div class="d-flex justify-content-center">
    <div class="col-lg-8 push-lg-4">
      <div class="tab-content p-b-3">
        <div class="tab-pane active" id="profile">
          <h4 class="m-y-2">Cv {{ displayedCv.firstname }} {{ displayedCv.name }}</h4>
          <div class="d-flex justify-content-center">
            <img #photo width="150px" height="150px" class="rounded-circle align-content-center"
              src="assets/images/{{ displayedCv.path | defaultImage }}"
              (error)="photo.src = 'assets/images/cv.png'" alt="{{ displayedCv.name }}" />
            </div>
            <div class="row">
              <div class="col-md-12">
                <h4 class="m-t-2">
                  <span class="fa fa-clock-o ion-clock pull-xs-right"></span>
                  Informations
                </h4>
                <table class="table table-hover table-striped">
                  <tbody>
                    <tr>
                      <td><strong>Name</strong> {{ displayedCv.name }}</td>
                    </tr>
                    <tr>
                      <td><strong>Firstname</strong> {{ displayedCv.firstname }}</td>
                    </tr>
                    <tr>
                      <td><strong>Job</strong> {{ displayedCv.job }}</td>
                    </tr>
                    <tr>
                      <td><strong>Age</strong> {{ displayedCv.age }}</td>
                    </tr>
                    <tr>
                      <td><strong>Cin</strong> {{ displayedCv.cin }}</td>
                    </tr>
                  </tbody>
                </table>
                <div class="d-flex justify-content-center">
                  @if (isAuthenticated()) {
                    <button (click)="deleteCv(displayedCv)" class="btn btn-danger">
                      Delete
                    </button>
                  }
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
